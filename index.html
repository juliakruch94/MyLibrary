<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="theme-color" content="#f8f4ec"><title>Моя бібліотека · Ex Libris</title>
<style>
:root{font-family:Georgia,'Times New Roman',serif;color:#322d29;background:#f8f4ec}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.wrap{max-width:1100px;margin:auto;padding:32px 20px 90px}header{border-bottom:1px solid #dcd4c7;padding-bottom:28px}.eyebrow{font:700 11px system-ui;letter-spacing:.22em;color:#a45c42;text-transform:uppercase}h1{font-size:clamp(40px,7vw,70px);font-weight:400;letter-spacing:-.045em;margin:10px 0}h2{font-weight:400;font-size:28px}p{line-height:1.6}.muted{color:#81776e}.top{display:flex;justify-content:space-between;align-items:start;gap:16px}.btn{background:#a6533c;border:1px solid #a6533c;color:white;border-radius:7px;padding:11px 16px;font:600 13px system-ui}.btn.ghost{background:transparent;color:#6b4539;border-color:#d6c6b9}.btn.small{padding:7px 11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0}.stat{border:1px solid #e3d9cb;background:#fffdf9;padding:20px;border-radius:10px}.stat strong{display:block;font-size:30px;font-weight:400}.stat span{font:12px system-ui;color:#81776e}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 14px}.toolbar input{flex:2;min-width:180px}.toolbar select{flex:1;min-width:135px}input,select,textarea{background:#fffefa;border:1px solid #d8cfc2;border-radius:7px;padding:11px;color:#322d29;width:100%}textarea{min-height:105px;resize:vertical}.count{font:12px system-ui;color:#81776e;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:13px}.book{background:#fffdf9;border:1px solid #e5dcd0;border-radius:10px;padding:20px;min-height:200px;display:flex;flex-direction:column;gap:8px}.book h3{font-size:22px;font-weight:400;line-height:1.2;margin:4px 0}.author{font:13px system-ui;color:#81776e}.pill{align-self:start;border-radius:20px;padding:5px 9px;background:#f0e9df;font:11px system-ui;color:#725746}.pill.reading{background:#eadcd2;color:#924d38}.pill.done{background:#e5eee4;color:#476747}.pill.abandoned{background:#eee6e6;color:#825b5b}.pill.sale{background:#f1e9d0;color:#78662b}.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px}.stars{color:#b97742;letter-spacing:2px}.empty{padding:36px;text-align:center;border:1px dashed #d8cfc2;border-radius:10px}.notice{background:#fff4df;border:1px solid #e6d0a5;border-radius:8px;padding:14px;font:13px/1.5 system-ui;margin:16px 0}.hidden{display:none!important}dialog{border:1px solid #ded1c3;border-radius:12px;max-width:520px;width:calc(100% - 28px);max-height:calc(100dvh - 24px);overflow-y:auto;overscroll-behavior:contain;padding:22px;background:#fffdf9;color:#322d29;box-shadow:0 20px 90px #0003}dialog[open]{position:fixed;inset:0;margin:auto}dialog::backdrop{background:#2b211c99}.form{display:grid;gap:13px}.form label{display:grid;gap:6px;font:12px system-ui;color:#685e55}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}.link{border:0;background:none;text-decoration:underline;color:#a6533c;font:12px system-ui}.auth{max-width:480px;margin:45px auto;padding:26px;border:1px solid #ded1c3;border-radius:10px;background:#fffdf9}.auth form{display:grid;gap:12px}.sub{font:13px system-ui;color:#81776e}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}@media(max-width:500px){.wrap{padding:22px 14px 65px}.stat{padding:14px}.stat strong{font-size:25px}.top{align-items:center}.book{min-height:170px}}
@media(max-width:600px){dialog{width:100%;max-width:none;height:100dvh;max-height:100dvh;margin:0;border:0;border-radius:0;padding:calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 18px)}dialog[open]{inset:0;margin:0}.form{gap:10px}.form h2{font-size:24px}.form label{gap:4px}.form input,.form select{padding:10px}.form textarea{min-height:65px}.actions{position:sticky;bottom:0;background:#fffdf9;padding:10px 0 calc(env(safe-area-inset-bottom, 0px) + 4px);margin-top:4px;border-top:1px solid #eee5da}.form .eyebrow{font-size:10px}}@media(max-height:680px){.form{gap:8px}.form h2{font-size:22px;margin:0}.form textarea{min-height:50px}}

/* Mobile editor: viewport-aware layout, prevent iOS input focus zoom */
.money{margin:-12px 0 28px;padding:23px 26px;border:1px solid #d7b9a5;border-radius:11px;background:#f4e8dc}.money .eyebrow{color:#94503a}.money-amount{font-size:clamp(34px,7vw,58px);line-height:1.15;letter-spacing:-.035em;color:#8e422d;margin:10px 0 8px;font-variant-numeric:tabular-nums}.money-note{font:12px/1.5 system-ui;color:#886b5c}@media(max-width:500px){.money{padding:19px;margin-top:-12px}.money-amount{font-size:37px}}@media(max-width:700px){html,body{overflow-x:hidden}dialog#editor{box-sizing:border-box!important;position:fixed!important;top:0!important;left:0!important;right:0!important;bottom:auto!important;inset:auto!important;margin:0!important;width:100vw!important;max-width:100vw!important;height:var(--editor-height,100dvh)!important;max-height:var(--editor-height,100dvh)!important;overflow:auto!important;-webkit-overflow-scrolling:touch;border:0!important;border-radius:0!important;padding:16px 16px 24px!important}#bookform{gap:9px}#bookform h2{font-size:23px;line-height:1.15;margin:0}#bookform label{font-size:12px;gap:4px}#bookform input,#bookform select,#bookform textarea{font-family:system-ui,sans-serif;font-size:16px!important;line-height:1.25;padding:9px 11px;min-height:40px}#bookform textarea{min-height:60px}#bookform .actions{position:sticky;bottom:0;z-index:2;background:#fffdf9;padding:10px 0 4px;margin-top:2px}#bookform .eyebrow{font-size:10px}}
.tag-list{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.tag-chip{border:1px solid #e3d8cb;background:#f7f0e7;border-radius:16px;padding:4px 8px;color:#795c4b;font:11px system-ui;cursor:pointer}.tag-chip:hover{background:#ecdfd0}.tag-chip.active{background:#a6533c;color:white;border-color:#a6533c}.tag-help{font:11px/1.5 system-ui;color:#81776e}.tag-suggest{display:flex;flex-wrap:wrap;gap:5px}.tag-suggest button{font:11px system-ui;border:1px solid #d9c8b9;background:#faf5ed;border-radius:15px;padding:5px 8px;color:#785441;cursor:pointer}.tag-filter{min-width:155px}.tag-reset{font:12px system-ui;border:0;background:transparent;color:#a6533c;text-decoration:underline;cursor:pointer}@media(max-width:500px){.tag-filter{width:100%}}
</style></head><body><div class="wrap">
<header><div class="top"><div><div class="eyebrow">Ex Libris · Особиста колекція</div><h1>Моя бібліотека</h1><div class="muted">Книжки, історії та читацькі враження</div></div></div></header>

<main id="main"><div class="stats"><div class="stat"><strong id="total">—</strong><span>У колекції</span></div><div class="stat"><strong id="done">—</strong><span>Прочитано</span></div><div class="stat"><strong id="reading">—</strong><span>Читаю зараз</span></div></div><section class="money" aria-label="Витрати на книжки"><div class="eyebrow">Фінансові наслідки книголюбства</div><div class="money-amount" id="money">—</div><div class="money-note">І це ще без вартості доставки… 🫣</div></section><div class="row"><button class="btn" id="add">+ Додати книжку</button></div><div class="toolbar"><input id="search" placeholder="Пошук за назвою або автором…" aria-label="Пошук"><select id="filter" aria-label="Статус"><option value="">Усі статуси</option><option value="shelf">На полиці</option><option value="reading">Читаю</option><option value="done">Прочитано</option><option value="abandoned">Відкладено</option><option value="sale">На продаж</option></select><select id="tagfilter" class="tag-filter" aria-label="Фільтр за тегом"><option value="">Усі теги</option></select><select id="sort" aria-label="Сортування"><option value="title">За назвою</option><option value="author">За автором</option><option value="updated">Нещодавно змінені</option><option value="rating">За оцінкою</option></select></div><div id="count" class="count"></div><button id="cleartag" class="tag-reset hidden" type="button">Скинути фільтр за тегом ×</button><div id="error" class="notice hidden" role="alert"></div><div id="books" class="grid"></div></main>
</div><dialog id="editor"><form id="bookform" class="form"><div class="eyebrow">Картка книжки</div><h2 id="formtitle" style="margin:0">Редагувати книжку</h2><label>Назва<input name="title" required maxlength="300"></label><label>Автор<input name="author" required maxlength="200"></label><label>Статус<select name="status"><option value="shelf">На полиці</option><option value="reading">Читаю</option><option value="done">Прочитано</option><option value="abandoned">Відкладено</option><option value="sale">На продаж</option></select></label><label>Оцінка<select name="rating"><option value="">Без оцінки</option><option value="1">★ 1</option><option value="2">★★ 2</option><option value="3">★★★ 3</option><option value="4">★★★★ 4</option><option value="5">★★★★★ 5</option></select></label><label>Ціна придбання, грн<input name="purchase_price_uah" type="number" min="0" step=".01" placeholder="Необов'язково"></label><label>Теги (через кому)<input name="tags" placeholder="постмодернізм, памʼять, Англія" autocomplete="off"><span class="tag-help">3–6 ознак, відомих ще до читання. Без спойлерів. Натисни на підказку, щоб додати тег.</span></label><div id="tagsuggest" class="tag-suggest"></div><label>Нотатки<textarea name="notes" placeholder="Думки, цитати, враження…"></textarea></label><div id="formerror" class="sub" role="alert"></div><div class="actions"><button type="button" id="cancel" class="btn ghost">Скасувати</button><button class="btn" id="save">Зберегти</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(()=>{'use strict';
const db=window.supabase.createClient('https://swiozkimdzyozhhtwqwl.supabase.co','sb_publishable_u-vpAfZ4gMG8jJ2phZ80zg_mKVPJYl0');
const $=id=>document.getElementById(id), labels={shelf:'На полиці',reading:'Читаю',done:'Прочитано',abandoned:'Відкладено',sale:'На продаж'};let books=[],editing=null;const normTag=t=>t.trim().replace(/^#+/,'').replace(/\s+/g,'_').toLocaleLowerCase('uk');
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=$('search').value.trim().toLocaleLowerCase('uk'),f=$('filter').value,s=$('sort').value,tag=$('tagfilter').value;let rows=books.filter(b=>(!f||b.status===f)&&(!tag||(b.tags||[]).includes(tag))&&(!q||(b.title+' '+b.author).toLocaleLowerCase('uk').includes(q)));rows.sort((a,b)=>s==='updated'?new Date(b.updated_at)-new Date(a.updated_at):s==='rating'?(b.rating||0)-(a.rating||0):(a[s]||'').localeCompare(b[s]||'','uk'));$('total').textContent=books.length;$('done').textContent=books.filter(b=>b.status==='done').length;$('reading').textContent=books.filter(b=>b.status==='reading').length;$('money').textContent=new Intl.NumberFormat('uk-UA',{maximumFractionDigits:2}).format(books.reduce((sum,b)=>sum+(Number(b.purchase_price_uah)||0),0))+' грн';$('count').textContent='Показано '+rows.length+' із '+books.length;$('books').innerHTML=rows.length?rows.map(b=>'<article class="book"><span class="pill '+safe(b.status)+'">'+safe(labels[b.status]||b.status)+'</span><h3>'+safe(b.title)+'</h3><div class="author">'+safe(b.author)+'</div>'+(b.tags?.length?'<div class="tag-list">'+b.tags.map(t=>'<button type="button" class="tag-chip" data-tag="'+safe(t)+'">#'+safe(t)+'</button>').join('')+'</div>':'')+(b.notes?'<div class="sub">'+safe(b.notes.length>90?b.notes.slice(0,90)+'…':b.notes)+'</div>':'')+'<div class="foot"><span class="stars">'+(b.rating?'★'.repeat(b.rating):'')+'</span><button class="link" data-edit="'+b.id+'">Редагувати</button></div></article>').join(''):'<div class="empty">Книжок за цим запитом не знайдено.</div>'}
async function load(){const {data,error}=await db.from('books').select('*').order('title');if(error){$('error').textContent='Не вдалося завантажити книжки: '+error.message;$('error').classList.remove('hidden');return}$('error').classList.add('hidden');books=data||[];updateTagOptions();render()}
load();
['search','filter','sort','tagfilter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
function fitEditor(){if(!window.visualViewport)return;document.documentElement.style.setProperty('--editor-height',Math.round(window.visualViewport.height)+'px')}
window.visualViewport?.addEventListener('resize',fitEditor);fitEditor();
function updateTagOptions(){const selected=$('tagfilter').value;const tags=[...new Set(books.flatMap(b=>b.tags||[]))].sort((a,b)=>a.localeCompare(b,'uk'));$('tagfilter').innerHTML='<option value="">Усі теги</option>'+tags.map(t=>'<option value="'+safe(t)+'">#'+safe(t)+'</option>').join('');$('tagfilter').value=tags.includes(selected)?selected:'';$('cleartag').classList.toggle('hidden',!$('tagfilter').value)}
$('tagfilter').addEventListener('change',()=>{$('cleartag').classList.toggle('hidden',!$('tagfilter').value)});$('cleartag').onclick=()=>{$('tagfilter').value='';$('cleartag').classList.add('hidden');render()};
function tagSuggestions(){const current=new Set($('bookform').elements.tags.value.split(',').map(normTag));const all=[...new Set(books.flatMap(b=>b.tags||[]))].filter(t=>!current.has(t)).sort((a,b)=>a.localeCompare(b,'uk')).slice(0,18);$('tagsuggest').innerHTML=all.map(t=>'<button type="button" data-suggest="'+safe(t)+'">#'+safe(t)+'</button>').join('')}
$('bookform').elements.tags.addEventListener('input',tagSuggestions);$('tagsuggest').onclick=e=>{const b=e.target.closest('[data-suggest]');if(!b)return;const input=$('bookform').elements.tags;input.value=[...new Set([...input.value.split(',').map(normTag).filter(Boolean),b.dataset.suggest])].join(', ');tagSuggestions()};
function edit(book){editing=book?.id||null;$('formtitle').textContent=editing?'Редагувати книжку':'Нова книжка';$('bookform').reset();for(const key of ['title','author','status','rating','purchase_price_uah','notes'])if(book&&book[key]!=null)$('bookform').elements[key].value=book[key];$('bookform').elements.tags.value=(book?.tags||[]).join(', ');tagSuggestions();$('formerror').textContent='';$('editor').showModal();fitEditor();$('cancel').focus({preventScroll:true});$('editor').scrollTop=0}
$('add').onclick=()=>edit(null);$('books').onclick=e=>{const btn=e.target.closest('[data-edit]');if(e.target.closest('[data-tag]')){$('tagfilter').value=e.target.closest('[data-tag]').dataset.tag;$('cleartag').classList.remove('hidden');render();window.scrollTo({top:0,behavior:'smooth'});return}if(btn){const book=books.find(b=>String(b.id)===btn.dataset.edit);if(book)edit(book)}};$('cancel').onclick=()=>$('editor').close();
$('bookform').onsubmit=async e=>{e.preventDefault();const f=e.target.elements,record={title:f.title.value.trim(),author:f.author.value.trim(),status:f.status.value,rating:f.rating.value?Number(f.rating.value):null,purchase_price_uah:f.purchase_price_uah.value?Number(f.purchase_price_uah.value):null,notes:f.notes.value,tags:[...new Set(f.tags.value.split(',').map(normTag).filter(Boolean))]};if(!record.title||!record.author)return;$('save').disabled=true;$('formerror').textContent='';const result=editing?await db.from('books').update(record).eq('id',editing):await db.from('books').insert(record);$('save').disabled=false;if(result.error){$('formerror').textContent=result.error.message;return}$('editor').close();await load()};
})();
</script></body></html>
